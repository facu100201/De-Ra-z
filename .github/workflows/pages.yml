name: Publicar en GitHub Pages

# Compila el sitio y lo publica en la rama gh-pages (fuente de GitHub Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_PREVENTA_API: ${{ vars.VITE_PREVENTA_API }}
          VITE_CONTACTO: ${{ vars.VITE_CONTACTO }}
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publicar sitio'
